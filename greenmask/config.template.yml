common:
  pg_bin_path: "/usr/lib/postgresql/16/bin"
  tmp_dir: "/tmp"

storage:
  type: "directory"
  directory:
    path: "/var/lib/greenmask/storage"

dump:
  pg_dump_options:
    dbname: "host=playground-db user=postgres password=example dbname=original"
    jobs: 4
  # transformation is appended at container start by merge_config.py from
  # /out/transformation.detected.yml (written by detector/, task 3) — this
  # template only carries the parts that don't depend on detection results.

restore:
  pg_restore_options:
    jobs: 4
    dbname: "host=playground-db user=postgres password=example dbname=transformed"
